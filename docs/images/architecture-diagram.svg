<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#05070e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35e0d0"/>
      <stop offset="100%" stop-color="#4c8dff"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5d73"/>
      <stop offset="100%" stop-color="#ffb642"/>
    </linearGradient>
    
    <!-- Filter for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4c8dff"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#35e0d0"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64e08a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ffb642"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="url(#cyanGrad)" />
    <text x="14" y="19" fill="#04121a" font-size="14" font-weight="900" text-anchor="middle">N</text>
    <text x="38" y="21" fill="#e8eef7" font-size="20" font-weight="700" letter-spacing="-0.5px">NEXUS<tspan fill="#35e0d0">AI</tspan></text>
    <text x="145" y="21" fill="#7b8aa0" font-size="13" font-weight="400">System Architecture &amp; Autonomous Investigation Pipeline</text>
    <rect x="990" y="4" width="110" height="22" rx="11" fill="#0e1b2d" stroke="#1f3756" stroke-width="1"/>
    <circle cx="1002" cy="15" r="3.5" fill="#64e08a"/>
    <text x="1012" y="19" fill="#a0b5d0" font-size="10.5" font-weight="500">100% OFFLINE</text>
  </g>

  <!-- SECTION 1: SIMULATED ENVIRONMENT & TOPOLOGY (TOP) -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="1100" height="270" rx="12" fill="url(#boxGrad)" stroke="#1a2638" stroke-width="1"/>
    <text x="24" y="30" fill="#7b8aa0" font-size="11" font-weight="700" letter-spacing="1px">SECTION 1 · CAUSAL SIMULATOR &amp; 4-TIER TOPOLOGY</text>
    <rect x="975" y="16" width="105" height="20" rx="4" fill="#131c2c" stroke="#25354e" stroke-width="1"/>
    <text x="1027" y="30" fill="#ffb642" font-size="10" font-weight="600" text-anchor="middle">SIMULATED</text>

    <!-- Tier 0: Edge -->
    <rect x="475" y="55" width="150" height="42" rx="8" fill="#111c30" stroke="#4c8dff" stroke-width="1.5"/>
    <text x="550" y="74" fill="#e8eef7" font-size="12" font-weight="600" text-anchor="middle">api-gateway</text>
    <text x="550" y="88" fill="#4c8dff" font-size="9" font-weight="500" text-anchor="middle">TIER 0 · GATEWAY</text>

    <!-- Connectors Tier 0 -> Tier 1 -->
    <path d="M 515 97 L 515 118 L 190 118 L 190 135" fill="none" stroke="#2a3d56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 535 97 L 535 125 L 430 125 L 430 135" fill="none" stroke="#2a3d56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 565 97 L 565 125 L 670 125 L 670 135" fill="none" stroke="#2a3d56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 585 97 L 585 118 L 910 118 L 910 135" fill="none" stroke="#2a3d56" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Tier 1: Application -->
    <g transform="translate(110, 135)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#0f202e" stroke="#35e0d0" stroke-width="1.5"/>
      <text x="80" y="19" fill="#e8eef7" font-size="11.5" font-weight="600" text-anchor="middle">auth-service</text>
      <text x="80" y="33" fill="#35e0d0" font-size="8.5" font-weight="500" text-anchor="middle">TIER 1 · SERVICE</text>
    </g>
    <g transform="translate(350, 135)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#0f202e" stroke="#35e0d0" stroke-width="1.5"/>
      <text x="80" y="19" fill="#e8eef7" font-size="11.5" font-weight="600" text-anchor="middle">payment-service</text>
      <text x="80" y="33" fill="#35e0d0" font-size="8.5" font-weight="500" text-anchor="middle">TIER 1 · SERVICE</text>
    </g>
    <g transform="translate(590, 135)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#0f202e" stroke="#35e0d0" stroke-width="1.5"/>
      <text x="80" y="19" fill="#e8eef7" font-size="11.5" font-weight="600" text-anchor="middle">recommendation-svc</text>
      <text x="80" y="33" fill="#35e0d0" font-size="8.5" font-weight="500" text-anchor="middle">TIER 1 · SERVICE</text>
    </g>
    <g transform="translate(830, 135)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#0f202e" stroke="#35e0d0" stroke-width="1.5"/>
      <text x="80" y="19" fill="#e8eef7" font-size="11.5" font-weight="600" text-anchor="middle">notification-service</text>
      <text x="80" y="33" fill="#35e0d0" font-size="8.5" font-weight="500" text-anchor="middle">TIER 1 · SERVICE</text>
    </g>

    <!-- Connectors Tier 1 -> Tier 2 & Tier 3 -->
    <path d="M 190 177 L 190 195 L 400 195 L 400 215" fill="none" stroke="#2a3d56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 400 177 L 400 215" fill="none" stroke="#2a3d56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 460 177 L 460 195 L 680 195 L 680 215" fill="none" stroke="#2a3d56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 670 177 L 670 215" fill="none" stroke="#2a3d56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 430 177 L 430 205 L 950 205 L 950 215" fill="none" stroke="#2a3d56" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Tier 2: Datastores & Cache -->
    <g transform="translate(320, 215)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#181328" stroke="#8b7cff" stroke-width="1.5"/>
      <text x="80" y="18" fill="#e8eef7" font-size="11.5" font-weight="600" text-anchor="middle">postgres-primary</text>
      <text x="80" y="31" fill="#8b7cff" font-size="8.5" font-weight="500" text-anchor="middle">TIER 2 · DATABASE</text>
    </g>
    <g transform="translate(600, 215)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#241a10" stroke="#ffb642" stroke-width="1.5"/>
      <text x="80" y="18" fill="#e8eef7" font-size="11.5" font-weight="600" text-anchor="middle">redis-cache</text>
      <text x="80" y="31" fill="#ffb642" font-size="8.5" font-weight="500" text-anchor="middle">TIER 2 · CACHE</text>
    </g>

    <!-- Tier 3: External SaaS -->
    <g transform="translate(870, 215)">
      <rect x="0" y="0" width="160" height="40" rx="8" fill="#151b24" stroke="#7b8aa0" stroke-width="1.5"/>
      <text x="80" y="18" fill="#e8eef7" font-size="11.5" font-weight="600" text-anchor="middle">stripe-api</text>
      <text x="80" y="31" fill="#7b8aa0" font-size="8.5" font-weight="500" text-anchor="middle">TIER 3 · EXTERNAL</text>
    </g>
  </g>

  <!-- STREAMING CONNECTOR FROM SIMULATOR TO INTELLIGENCE PIPELINE -->
  <g transform="translate(550, 360)">
    <path d="M 50 0 L 50 28" fill="none" stroke="#35e0d0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowCyan)"/>
    <rect x="-85" y="8" width="270" height="18" rx="9" fill="#0a1926" stroke="#1d4860" stroke-width="1"/>
    <text x="50" y="20.5" fill="#35e0d0" font-size="9.5" font-weight="600" text-anchor="middle">15s Tick Telemetry &amp; Structured Logs Stream</text>
  </g>

  <!-- SECTION 2: AUTONOMOUS INCIDENT INTELLIGENCE PIPELINE (BOTTOM) -->
  <g transform="translate(50, 395)">
    <rect x="0" y="0" width="1100" height="385" rx="12" fill="url(#boxGrad)" stroke="#1a2638" stroke-width="1"/>
    <text x="24" y="28" fill="#7b8aa0" font-size="11" font-weight="700" letter-spacing="1px">SECTION 2 · REAL STATISTICAL &amp; ML INVESTIGATION PIPELINE</text>
    <rect x="980" y="14" width="100" height="20" rx="4" fill="#0e2319" stroke="#1b4931" stroke-width="1"/>
    <text x="1030" y="28" fill="#64e08a" font-size="10" font-weight="600" text-anchor="middle">REAL CORE</text>

    <!-- Pipeline Step 1: Anomaly Detection -->
    <g transform="translate(25, 50)">
      <rect x="0" y="0" width="240" height="95" rx="8" fill="#0d1829" stroke="#253c5e" stroke-width="1"/>
      <rect x="12" y="10" width="60" height="16" rx="3" fill="#1b2a40"/>
      <text x="42" y="22" fill="#4c8dff" font-size="9" font-weight="700" text-anchor="middle">STAGE 1–3</text>
      <text x="80" y="22" fill="#e8eef7" font-size="11" font-weight="600">Anomaly Detection</text>
      <text x="12" y="44" fill="#7b8aa0" font-size="9.5" leading="1.3">
        <tspan x="12" dy="0">• Fourier Harmonics (H=3) baseline</tspan>
        <tspan x="12" dy="14">• AR(1) residual whitening filter</tspan>
        <tspan x="12" dy="14">• Ledoit-Wolf Mahalanobis + IF</tspan>
        <tspan x="12" dy="14">• 3-of-5 temporal persistence gate</tspan>
      </text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 265 97 L 295 97" fill="none" stroke="#4c8dff" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Pipeline Step 2: Fault Localization -->
    <g transform="translate(295, 50)">
      <rect x="0" y="0" width="240" height="95" rx="8" fill="#0d1829" stroke="#253c5e" stroke-width="1"/>
      <rect x="12" y="10" width="55" height="16" rx="3" fill="#1b2a40"/>
      <text x="39" y="22" fill="#4c8dff" font-size="9" font-weight="700" text-anchor="middle">STAGE 4</text>
      <text x="75" y="22" fill="#e8eef7" font-size="11" font-weight="600">Fault Localization</text>
      <text x="12" y="44" fill="#7b8aa0" font-size="9.5">
        <tspan x="12" dy="0">• Two-sided CUSUM changepoint</tspan>
        <tspan x="12" dy="14">• Topological DAG blame propagation</tspan>
        <tspan x="12" dy="14">• Onset lead vs victim backpressure</tspan>
        <tspan x="12" dy="14">• Upstreamness ranking (Top-1: 71.7%)</tspan>
      </text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 535 97 L 565 97" fill="none" stroke="#4c8dff" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Pipeline Step 3: 35-Feature RCA Classifier -->
    <g transform="translate(565, 50)">
      <rect x="0" y="0" width="240" height="95" rx="8" fill="#0d1829" stroke="#253c5e" stroke-width="1"/>
      <rect x="12" y="10" width="60" height="16" rx="3" fill="#1b2a40"/>
      <text x="42" y="22" fill="#4c8dff" font-size="9" font-weight="700" text-anchor="middle">STAGE 7–9</text>
      <text x="80" y="22" fill="#e8eef7" font-size="11" font-weight="600">RCA Classifier</text>
      <text x="12" y="44" fill="#7b8aa0" font-size="9.5">
        <tspan x="12" dy="0">• 35 class-agnostic features</tspan>
        <tspan x="12" dy="14">• Multinomial Logistic (L2 regularized)</tspan>
        <tspan x="12" dy="14">• GroupKFold(4) seed-grouped CV</tspan>
        <tspan x="12" dy="14">• 95.0% accuracy (Macro-F1: 0.95)</tspan>
      </text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 805 97 L 835 97" fill="none" stroke="#4c8dff" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Pipeline Step 4: Hybrid Runbook Retrieval -->
    <g transform="translate(835, 50)">
      <rect x="0" y="0" width="240" height="95" rx="8" fill="#0d1829" stroke="#253c5e" stroke-width="1"/>
      <rect x="12" y="10" width="65" height="16" rx="3" fill="#1b2a40"/>
      <text x="44" y="22" fill="#4c8dff" font-size="9" font-weight="700" text-anchor="middle">STAGE 11</text>
      <text x="85" y="22" fill="#e8eef7" font-size="11" font-weight="600">Runbook Retrieval</text>
      <text x="12" y="44" fill="#7b8aa0" font-size="9.5">
        <tspan x="12" dy="0">• Pure-Python BM25 exact matching</tspan>
        <tspan x="12" dy="14">• TF-IDF + Truncated SVD semantics</tspan>
        <tspan x="12" dy="14">• Reciprocal Rank Fusion (RRF)</tspan>
        <tspan x="12" dy="14">• 10 playbooks / 40 chunks (Recall@3: 60%)</tspan>
      </text>
    </g>

    <!-- DOWN CONNECTOR TO STAGE 2 ROW -->
    <path d="M 955 145 L 955 175" fill="none" stroke="#4c8dff" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Pipeline Step 5: 9-Tool Investigation Agent & LLM Synthesis -->
    <g transform="translate(25, 175)">
      <rect x="0" y="0" width="360" height="105" rx="8" fill="#0d1c24" stroke="#1d4860" stroke-width="1"/>
      <rect x="12" y="10" width="60" height="16" rx="3" fill="#123040"/>
      <text x="42" y="22" fill="#35e0d0" font-size="9" font-weight="700" text-anchor="middle">STAGE 5–6</text>
      <text x="80" y="22" fill="#e8eef7" font-size="11" font-weight="600">9-Tool Investigation Loop</text>
      <text x="12" y="42" fill="#7b8aa0" font-size="9">
        <tspan x="12" dy="0">Tools: query_metrics · search_logs · get_deployments · get_topology</tspan>
        <tspan x="12" dy="13">search_runbooks · read_runbook · get_blame_ranking · estimate_impact</tspan>
        <tspan x="12" dy="13">compare_windows (Welch's t-test shift detection)</tspan>
        <tspan x="12" dy="14" fill="#35e0d0">LLM Critiques &amp; Narrates; Never Originates Verdict</tspan>
      </text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 835 227 L 400 227 L 385 227" fill="none" stroke="#35e0d0" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- Pipeline Step 6: Business Impact & Blast Radius -->
    <g transform="translate(415, 175)">
      <rect x="0" y="0" width="280" height="105" rx="8" fill="#1b1728" stroke="#3d2c5e" stroke-width="1"/>
      <rect x="12" y="10" width="65" height="16" rx="3" fill="#2d1c47"/>
      <text x="44" y="22" fill="#8b7cff" font-size="9" font-weight="700" text-anchor="middle">STAGE 10</text>
      <text x="85" y="22" fill="#e8eef7" font-size="11" font-weight="600">Business Impact Model</text>
      <text x="12" y="42" fill="#7b8aa0" font-size="9">
        <tspan x="12" dy="0">• Dynamic Revenue-at-Risk computation</tspan>
        <tspan x="12" dy="13">• Transitive downstream blast radius</tspan>
        <tspan x="12" dy="13">• Active SLO error budget burn rate</tspan>
        <tspan x="12" dy="13">• Severity classification (SEV1 / SEV2)</tspan>
      </text>
    </g>

    <!-- Arrow 5 -> 6 -->
    <path d="M 385 227 L 415 227" fill="none" stroke="#8b7cff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- Arrow 6 -> 7 -->
    <path d="M 695 227 L 725 227" fill="none" stroke="#ffb642" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

    <!-- Pipeline Step 7: Human-in-the-Loop Approval Gate -->
    <g transform="translate(725, 175)">
      <rect x="0" y="0" width="350" height="105" rx="8" fill="#21190d" stroke="#5e4419" stroke-width="1.5"/>
      <rect x="12" y="10" width="65" height="16" rx="3" fill="#3b2909"/>
      <text x="44" y="22" fill="#ffb642" font-size="9" font-weight="700" text-anchor="middle">STAGE 12</text>
      <text x="85" y="22" fill="#e8eef7" font-size="11" font-weight="600">Human Approval Barrier</text>
      <text x="12" y="42" fill="#c4a56a" font-size="9">
        <tspan x="12" dy="0">• Hard asyncio.Event gate on Tier-0/1 mutations</tspan>
        <tspan x="12" dy="13">• Operator inspects blast radius, risk, &amp; diff</tspan>
        <tspan x="12" dy="13">• Approve recommendation, alternative, or reject</tspan>
        <tspan x="12" dy="14" fill="#ffb642" font-weight="600">Zero Destructive Actions Without Operator Consent</tspan>
      </text>
    </g>

    <!-- DOWN CONNECTOR TO VERIFICATION ROW -->
    <path d="M 900 280 L 900 305" fill="none" stroke="#64e08a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <!-- Pipeline Step 8: Execution & Verification Loop -->
    <g transform="translate(25, 305)">
      <rect x="0" y="0" width="1050" height="60" rx="8" fill="#0d1f18" stroke="#1c4731" stroke-width="1"/>
      <rect x="16" y="18" width="80" height="22" rx="4" fill="#133524"/>
      <text x="56" y="33" fill="#64e08a" font-size="9.5" font-weight="700" text-anchor="middle">STAGE 13–15</text>
      <text x="110" y="28" fill="#e8eef7" font-size="12" font-weight="600">Closed-Loop Remediation &amp; Recovery Verification</text>
      <text x="110" y="44" fill="#7b8aa0" font-size="10">
        Action executed in simulation ──► Statistical detector monitors post-remediation telemetry for 6 consecutive clear ticks ──► Verifies recovery or triggers escalation
      </text>
      <rect x="940" y="18" width="90" height="22" rx="4" fill="#1b4931"/>
      <text x="985" y="32" fill="#64e08a" font-size="9.5" font-weight="700" text-anchor="middle">CLOSED-LOOP</text>
    </g>
  </g>

  <!-- CLOSED-LOOP FEEDBACK ARROW BACK TO SIMULATOR -->
  <path d="M 50 425 L 30 425 L 30 220 L 50 220" fill="none" stroke="#64e08a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <rect x="8" y="300" width="45" height="18" rx="4" fill="#05070e" stroke="#1c4731" stroke-width="1"/>
  <text x="30" y="312" fill="#64e08a" font-size="8" font-weight="700" text-anchor="middle">REPAIR</text>
</svg>
